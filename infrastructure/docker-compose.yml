# 本地开发基础设施（TP-0-02，设计稿 22.3.2）
#
# 仅供本地开发与集成测试。生产部署走 Helm（TP-5-09）。
#
# 用法：
#   pnpm infra:up      启动
#   pnpm infra:logs    看日志
#   pnpm infra:down    停止（保留数据卷）

name: travel-poster-system

services:
  # 必须是 pgvector/pgvector 而非官方 postgres —— 后者不含 vector 扩展，
  # 迁移 0001 会失败（设计稿 22.3.2、L-09）
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tps
      POSTGRES_PASSWORD: tps_local_dev_only
      POSTGRES_DB: travel_poster
      # 容器内统一 UTC；应用按请求 timezone 转换（设计稿 22.3.1）
      TZ: UTC
      PGTZ: UTC
      # C.UTF-8 排序，避免依赖宿主 locale 导致索引行为不一致
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tps -d travel_poster']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-bookworm
    container_name: tps-redis
    restart: unless-stopped
    # appendonly 保证本地重启后队列与会话不丢，便于复现问题
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    environment:
      TZ: UTC
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 兼容对象存储（设计稿 1.1「文件」）
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tps-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: tps
      MINIO_ROOT_PASSWORD: tps_local_dev_only
      TZ: UTC
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性任务：创建素材与导出两个桶后退出
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tps-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # TP-6-15：挂载生命周期规则，让本地与生产用**同一份**声明
    # （见 deploy/storage/README.md：只有 users/ 前缀挂规则，anon/ 不挂）
    volumes:
      - ../deploy/storage:/config:ro
    # ## 两个桶的匿名读策略是相反的，且都必须显式声明
    #
    # 素材桶 `download`（允许匿名读）：素材 URL 由 S3_PUBLIC_BASE_URL 直接拼出
    # 写进 ViewModel（19.3），是渲染页与浏览器里的普通 <img src>，没有签名。
    # 键形如 `assets/{role}/{ab}/{id}.webp` —— 15.4 明确它**全局共享、与用户
    # 空间无关**，因此公开读不泄露任何用户私有内容。
    #
    # 导出桶 `none`（拒绝匿名读）：那里才是用户私有产物
    # （`users/{user_id}/...` 与 `anon/...`），访问一律走 13.6 的 SigV4 预签名。
    #
    # 这两行此前**不存在**，而部署文档的 Nginx 段注释写着「素材公开读」——
    # 也就是说那个前提整个仓库里没有任何一处建立。缺失的表现极其隐蔽：
    # 素材图片一律 403，而 RenderReadyProbe 刻意让坏图不阻塞就绪
    # （十八章降级链），于是导出照样 COMPLETED、健康检查全绿、
    # 用户拿到的长图里每个图片位置都是空白。
    #
    # 显式写 `none` 而不是依赖默认值：默认值是 MinIO 的实现细节，
    # 而「导出桶不可匿名读」是安全约束，不该靠默认值成立。
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tps tps_local_dev_only &&
      mc mb --ignore-existing local/tps-assets &&
      mc mb --ignore-existing local/tps-exports &&
      mc ilm import local/tps-exports < /config/exports-lifecycle.json &&
      mc anonymous set download local/tps-assets &&
      mc anonymous set none local/tps-exports &&
      echo 'buckets ready'
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
