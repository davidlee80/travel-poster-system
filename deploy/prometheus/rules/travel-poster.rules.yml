# Prometheus 记录规则与告警规则（TP-5-04，设计稿 21.3）
#
# ## 为什么规则文件必须进仓库
#
# 21.3 的六条告警是「验收标准的执行方式」：门禁 #5 说
# `travel_icon_load_failure_total` 恒为 0，而让它恒为 0 的不是那句话，
# 是这里的告警。规则留在某个人的 Grafana 里，等于验收标准没有执行者。
#
# ## 这个文件由测试校验
#
# packages/observability/src/alert-rules.test.ts 断言：
#   - 每条规则引用的指标都在 21.3 的指标目录里（catalog.ts）；
#   - 六条告警一条不少；
#   - 每条告警都有 `for`（除了两条「任意一次即告警」的）与 runbook 链接。
#
# 拦的是告警最常见、也最难发现的失效方式：**表达式引用了一个不存在的指标**。
# PromQL 对不存在的指标返回空集，于是那条告警永远不触发 —— 而 Prometheus
# 的界面上它显示为「正常」。指标改名、打错字、或者应用侧那个指标从未被注册
# （P5 之前六个 21.3 指标就是这个状态），症状完全一样。
#
# 注解用 `runbook` 而不是 Alertmanager 惯例的 `runbook_url`：值是仓库内的
# 文档路径，不是 URL。叫 `_url` 却放一个相对路径只会让点它的人得到 404。
# 等有了公网 runbook 站点再改名并换成完整链接。

groups:
  # ── 记录规则（R-31）──────────────────────────────────────
  #
  # `travel_asset_cache_hit_ratio` 在 21.3 原表里是 Gauge。R-31 改成记录规则：
  # Gauge 是单进程状态，多副本部署时每个 Worker 各报一个自己的命中率，
  # 「平均命中率」不能由它们简单平均得出（各副本处理的槽位数不同），
  # 进程重启还会让它归零。记录规则天然跨副本聚合，且不受重启影响。
  - name: travel-poster-recording
    interval: 1m
    rules:
      - record: travel_asset_cache_hit_ratio
        expr: |
          sum by (role) (rate(travel_asset_resolution_total{strategy="cache_hit"}[30m]))
            /
          sum by (role) (rate(travel_asset_resolution_total[30m]))

  # ── 告警（设计稿 21.3 列了六条，实际已长到下面这些）────────────────────────────
  - name: travel-poster-alerts
    rules:
      # 0. 队列积压（背压的**先行**指标）
      #
      # ## 为什么 T1 SLA 那条不够
      #
      # T1 从提交算起，已经包含排队时长，所以下面那条看上去已经覆盖了积压。
      # 但直方图只在任务**完成时**落样本：队列积压到 200 条时，T1 的 P95
      # 反映的是三分钟前完成的那批，而正在受苦的这 200 个用户还一个都没进过
      # 直方图 —— 等它们进去时人已经走了。队列深度在第一个用户超时之前就升高，
      # 是唯一能在用户受影响前介入的窗口。
      #
      # ## 为什么是 max 而不是 sum
      #
      # 队列在 Redis 里只有一份，而每个 API 副本都上报同一个全局值。
      # `sum` 会让告警阈值随副本数缩水（三个副本 → 深度看起来三倍）。
      # `max` 同时对采样失败的副本稳健：那个副本会保持旧值，而取最大值
      # 宁可早报不漏报。
      #
      # ## 阈值 8 的来历，以及扩容后必须调它
      #
      # generation-worker 的 concurrency 是 2（硬编码）。T1 预算 75 秒、处理本身
      # 约 20～30 秒，于是留给排队的余量约 45 秒；单副本吞吐约 4～5 任务/分钟，
      # 因此深度超过 4 就会把 T1 吃掉。取 8 （两倍）是为了给两副本默认部署
      # 留余地并滤掉瞬时突发。
      #
      # **加了 Worker 副本就必须同步抬这个阈值**，否则它会变成噪声：
      # 五副本的容量下深度 8 是健康的。这一条写进了运维手册。
      - alert: TravelQueueBacklogHigh
        expr: max by (queue) (travel_queue_depth) > 8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.queue }} 队列积压超过 8 条且持续 5 分钟'
          description: '提交速率超过了消费能力。先确认 Worker 没有全挂（travel_job_total 还在增长），再加副本 —— 生成队加 generation-worker，导出队加 render-worker。排队超 600 秒的任务会在花掉 LLM 调用之前先 FAILED（JOB_QUEUE_TIMEOUT），因此积压不会无限增长，但那意味着在丢请求。'
          runbook: 'docs/运维手册.md#队列积压'

      # 1. SLA 违约（21.2 的 T1 < 75 秒）
      #
      # 只看 ≤7 天那一档：8～14 天的目标不同（要分段调两次模型），
      # 混在一起会让一个全是 14 天请求的时段看起来在违约，
      # 而它其实符合那一档的目标。
      - alert: TravelJobT1SlaBreach
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(travel_job_milestone_seconds_bucket{milestone="t1",total_days_bucket="1-7"}[15m])
            )
          ) > 75
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'T1（计划可读）P95 超过 75 秒'
          description: '设计稿 21.2 的分段 SLA 违约。先看 travel_job_duration_seconds 按 stage 分解，定位是排队、模型还是校验。'
          runbook: 'docs/运维手册.md#t1-sla-违约'

      # 2. 缓存失效（21.2 措施二的前提）
      #
      # Hero 缓存命中率是「20 秒 AI 生成不进入首屏路径」这套设计的前提：
      # 命中率掉下来意味着大量请求要现场等 AI，T2 随之崩掉。
      # 因此这条告警在 T2 违约**之前**就会响。
      - alert: TravelHeroCacheHitRatioLow
        expr: travel_asset_cache_hit_ratio{role="HERO_BACKGROUND"} < 0.7
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Hero 缓存命中率低于 0.7'
          description: '19.5 的预热库可能未覆盖当前热门目的地。检查 travel_asset_resolution_total 的 strategy 分布。'
          runbook: 'docs/运维手册.md#hero-缓存命中率下降'

      # 2b. 占位图占比（降级是静默的，这是它唯一的信号）
      #
      # ## 它回答的问题只有一个：有多少用户拿到的是渐变图
      #
      # 五层降级链的最后一层是渐变占位图。它落到这一层时：任务 COMPLETED、
      # 页面 ready、错误率正常 —— 用户拿到一份「完整」的产物，只是图都是色块。
      # 在这条告警之前，这个问题只能手工查 strategy 分布。
      #
      # ## 为什么必须带 outcome="fallback"
      #
      # `STATIC_DEFAULT` 这个策略名被**两种结局**共用（见 resolvers/fallback.ts）：
      #
      # ```text
      # outcome="fallback"  fallback_level 2  真的给了占位图，用户看得到
      # outcome="skipped"   fallback_level 3  槽位被跳过，模板不渲染那个位置
      # ```
      #
      # 不过滤的话被模板隐藏的槽位会把比例抬高，而那些槽位本来就不影响用户。
      #
      # ## 为什么两侧都排除 ROUTE_MAP
      #
      # 路线图走独立的 svg-map resolver（SVG_RENDER 或 TEXT_FALLBACK），
      # 它几乎不可能产生 static_default。把它留在分母里只会稀释比例 ——
      # 14 天行程里路线图占全部槽位约六分之一，足以把一个真问题压到阈值下。
      #
      # ## 阈值 0.2 是个起始值，待预热覆盖率实测后收紧
      #
      # 21.2 措施二期望预热覆盖 ≥ 80% 的 Hero 请求，因此健康状态下占位图应当
      # 只是残余。但现在不能取 5%：
      #
      #   - 匿名用户的 QUOTA_ANON_AI_HERO 是 0，冷组合必然落到占位图；
      #   - 预热覆盖率从未在生产规模验证（门禁 #17 是 manual）。
      #
      # 0.2 的意义是「五个槽位里有一个是色块」—— 那已经是可见的产品降级。
      # 实测出真实命中率之后应当把它收到接近那个残余。
      - alert: TravelAssetPlaceholderRatioHigh
        expr: |
          sum(rate(travel_asset_resolution_total{strategy="static_default",outcome="fallback",role!="ROUTE_MAP"}[30m]))
            /
          sum(rate(travel_asset_resolution_total{role!="ROUTE_MAP"}[30m])) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '超过 20% 的素材槽位降级为占位图'
          description: '用户拿到的是渐变色块而不是图，而任务、导出与错误率全部正常。先看 travel_asset_resolution_total 的 strategy 分布定位是哪一层没接住：cache_hit 占比低是预热没覆盖（看 TravelHeroCacheHitRatioLow），local_library_match 低是素材库太空，ai_generation 低则查额度与供应商。'
          runbook: 'docs/运维手册.md#占位图占比升高'

      # 3. 图标回归（验收标准 5，期望恒为 0）
      #
      # 没有 `for`：一次就是缺陷。图标是内联进构建产物的（9.1），
      # 运行期没有网络请求可失败 —— 计数大于 0 只有一种原因：
      # ViewModel 里出现了清单外的图标引用，即契约漂移。
      - alert: TravelIconLoadFailure
        expr: increase(travel_icon_load_failure_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: '渲染页面出现无法解析的图标引用'
          description: '验收标准 5 要求恒为 0。多半是新增了图标键但漏配 @tps/icon-library 的映射。'
          runbook: 'docs/运维手册.md#图标加载失败'

      # 3b. 素材图片加载失败（按比例判定）
      #
      # 与上一条互补：那条查契约漂移（清单外的图标键），这条查**网络层失败**
      # —— ViewModel 里的素材 URL 取不到。
      #
      # ## 为什么必须有这条告警
      #
      # RenderReadyProbe 刻意让坏图不阻塞就绪（十八章降级链：一张坏图不该让
      # 整份导出作废）。那个决定是对的，但副作用是素材全军覆没时：页面照样
      # ready、travel_render_degraded_total 不动、导出照样 COMPLETED ——
      # 用户拿到图片位置全是空白的长图，而在这条告警之前**没有任何信号**。
      #
      # ## 为什么用比例而不是计数
      #
      # 「21 张里坏 1 张」是降级链在正常工作（景点图缺失不阻断流程），
      # 「21 张全坏」是配置错误（S3_PUBLIC_BASE_URL 在渲染容器内解析不到、
      # 或素材桶不允许匿名读）。计数分不出这两者，比例可以。
      #
      # 阈值 50%：正常降级极少同时命中一半以上槽位，而配置错误必然是 100%。
      # `for: 15m` 是为了滤掉素材刚入库那一小段的缓存穿透。
      - alert: TravelAssetImageLoadFailureRatioHigh
        expr: |
          sum(rate(travel_render_asset_image_failure_total[30m]))
            /
          sum(rate(travel_render_asset_image_seen_total[30m])) > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '渲染时超过一半素材图片加载失败'
          description: '导出仍会显示 COMPLETED，但产物里图片位置是空白的。先查 S3_PUBLIC_BASE_URL 在 render-worker 容器内能否解析，再查素材桶是否允许匿名读。render-worker 日志里有「素材图片全部加载失败」那一行。'
          runbook: 'docs/运维手册.md#素材图片加载失败'

      # 3c. T2 违约（21.2 的 T2 P95 < 155 秒）
      #
      # ## 为什么现在才有这条，以及为什么阈值是 155 而不是 110
      #
      # T2 此前只有度量手段（`travel_job_milestone_seconds{milestone="t2"}`）
      # 与门禁 #16 的人工判定，没有告警 —— 而多模型故障转移把素材窗口从
      # 35 秒放宽到 80 秒（40 秒/候选 × 2），T2 目标随之从 110 调到 155。
      # 一个刚被有意放宽的 SLA 如果没有告警，「放宽」与「失控」就没有区别。
      #
      # 155 = T1(75) + 素材窗口(80)。三个数字必须一起改，改一个的后果是
      # 告警变噪音（阈值偏紧）或永不触发（偏松）。
      #
      # 与 T1 那条一样只看 ≤7 天档：8～14 天要分段调两次模型，目标不同。
      - alert: TravelJobT2SlaBreach
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(travel_job_milestone_seconds_bucket{milestone="t2",total_days_bucket="1-7"}[15m])
            )
          ) > 155
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'T2（页面可看）P95 超过 155 秒'
          description: '素材解析窗口被吃满。先看 travel_ai_failover_total 是否 position > 0 占比高（主模型在拖），再看 travel_asset_cache_hit_ratio 是否掉了（预热没覆盖热门目的地）。'
          runbook: 'docs/运维手册.md#t2-sla-违约'

      # 3d. 主模型胜出率下降（故障转移在掩盖故障）
      #
      # 故障转移的价值就是把主模型的故障变成「慢一点」，这也是它的危险：
      # 主模型完全挂掉时成功率、`travel_ai_image_total`、任务状态全都正常。
      # 唯一的信号是「备选被用上的占比」。
      #
      # 阈值 20%：偶发（供应商的某个节点抖动）本就会有个位数占比，
      # 而系统性故障会迅速逼近 100%。`for: 15m` 滤掉单次波动。
      #
      # severity 是 warning 而不是 critical：用户此刻**拿得到产物**，
      # 只是慢了一点、贵了一点。判据与 21.3 其余告警一致 ——
      # 产物对用户是否还有价值。
      - alert: TravelAiFailoverRatioHigh
        expr: |
          sum by (kind) (rate(travel_ai_failover_total{position!="0"}[30m]))
            /
          sum by (kind) (rate(travel_ai_failover_total[30m])) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '超过 20% 的模型调用要靠备选候选才成功'
          description: '主模型在超时或报错，而故障转移把它掩盖成「慢一点」。用 pnpm model:pool -- --list 确认当前候选顺序，再查主模型在中转站侧的状态。position="none" 的部分是整条链都失败。'
          runbook: 'docs/运维手册.md#主模型胜出率下降'

      # 3e. 候选数被截断（配置超出时延预算）
      #
      # 没有 `for`：这不是波动而是配置状态 —— 有增长就说明运营配的
      # `max_candidates` 大于时延预算允许的值，而**运行时只会静默按截断后的
      # 数量执行**。不告警的话，那位运营会以为配置生效了，然后花几天调查
      # 「为什么候选数调上去成功率没变」。
      - alert: TravelAiPoolClamped
        expr: increase(travel_ai_pool_clamped_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: '候选池的配置候选数被时延预算截断'
          description: '运行时只试了截断后的数量。pnpm model:pool -- --list 会显示每档实际生效的候选数；要么下调 max_candidates，要么调高 IMAGE_JOB_AI_BUDGET_MS（同时要调 T2 阈值）。'
          runbook: 'docs/运维手册.md#候选池配置被截断'

      # 4. 修复异常（规则集可能过严）
      #
      # P95 贴到 3 轮意味着规则集把大量正常输出判成了违规 ——
      # 那是**我们的**问题而不是模型的，而它的代价是每个任务多花两次
      # 定向重生成的钱。
      - alert: TravelPlanRepairIterationsHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(travel_plan_repair_iterations_bucket[1h]))
          ) >= 3
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '程序化修复轮次 P95 达到 3'
          description: '按 travel_validation_violations_total 的 rule_id 排序，找最常触发的那几条规则，确认它们是否过严。'
          runbook: 'docs/运维手册.md#修复轮次异常'

      # 5. 降级异常（降级产物占比 > 10%）
      #
      # 分母用 travel_job_total 而不是渲染次数：21.3 原文写的是
      # `travel_render_degraded_total / travel_job_total`，
      # 它回答的是「多少比例的用户拿到了降级产物」。
      - alert: TravelRenderDegradedRatioHigh
        expr: |
          sum(rate(travel_render_degraded_total[30m]))
            /
          sum(rate(travel_job_total[30m])) > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '降级产物占比超过 10%'
          description: '17.3 的四轮重渲染兜不住。看 travel_render_overflow_rounds 的分布与 template_id，多半是模板默认版式对真实内容偏紧。'
          runbook: 'docs/运维手册.md#降级产物占比升高'

      # 6. 字体故障（17.5，任意一次即告警）
      #
      # R-42：21.3 原文的条件是「日志出现 CJK_FONT_UNAVAILABLE」，而
      # Prometheus 不看日志 —— 照原文写就是一条永远不会触发的告警。
      # 改判在 travel_render_failure_total 上（render-worker 把
      # RenderError.detail 计成 reason_code）。
      #
      # 没有 `for`：字形缺失会让页面变成豆腐块，而那种产物对用户毫无价值。
      # 17.5 明确「不允许降级输出」，因此第一次出现就必须有人看。
      - alert: TravelCjkFontUnavailable
        expr: increase(travel_render_failure_total{reason_code="CJK_FONT_UNAVAILABLE"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: '渲染容器内中文字体不可用'
          description: '17.5 的字形断言失败，页面会是豆腐块。检查渲染镜像的 /usr/share/fonts 与 web 服务的 /fonts/ 静态资源。'
          runbook: 'docs/运维手册.md#中文字体故障'

      # 7. 坏账速率异常（C-7）
      #
      # 「我们自己吃掉的钱」有两个来源，处置完全不同：
      #   结算超支   预留取的是典型值，真实用量超出预留又超出用户余额
      #              → 估算参数或价目不准
      #   任务失败   上游故障时每次失败都真的烧了供应商的钱
      #              → 那一头有自己的告警（AiFailover / LlmDuration）
      #
      # 两者共用一条曲线是刻意的：这条告警回答的是「现在正在亏多少」，
      # 而那个数不该按原因拆成两条再让人相加。
      #
      # 阈值 5000 CR / 小时 = 5 元/小时。按占位价一次生成约 1～3 元，
      # 因此它相当于「每小时有两三次生成的钱是我们出的」——
      # 偶发的失败退款不会到这个量级，而一次上游故障会瞬间越过它。
      - alert: TravelCreditWriteOffHigh
        expr: sum(rate(travel_credit_settled_cr_total{direction="write_off"}[1h])) * 3600 > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '坏账速率超过 5000 CR/小时'
          description: '先看 travel_job_total{status="FAILED"} 是否同时升高：升高说明是上游故障在烧钱（看故障转移与模型延迟），没升高说明是估算不准（结算超支），要调 CREDIT_HOLD_BUFFER_PERCENT 或重定价目。'
          runbook: 'docs/运维手册.md#坏账速率异常'

      # 8. 有 SKU 没配价（C-7）
      #
      # 运营往模型池里加模型、忘了登记价格 —— 那两件事在不同的表、
      # 由不同的命令完成，因此一定会发生。此时系统**不报错**：
      # 命中兜底价就按一个偏贵的价收，连兜底都没有就完全不收费。
      # 两种都只有这条曲线能发现。
      #
      # `for: 15m` 而不是「一次即告警」：一次可能来自灰度中的新模型，
      # 而漏配的表现是持续命中 —— 15 分钟足以把两者分开。
      - alert: TravelCreditUnpriced
        expr: sum by (domain) (increase(travel_credit_unpriced_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '有 SKU 没有登记单价（走兜底价或未计费）'
          description: '看日志里 stage=billing 的 sku 字段拿到完整 SKU（含模型名），然后 clone_credit_prices 补上那一项并发布。domain=llm.in|llm.out 说明是模型漏配，其余说明固定项漏配。'
          runbook: 'docs/运维手册.md#有sku没配价'

      # 9. 余额不足占比升高（C-7）
      #
      # **这是一条产品告警，不是故障告警。**
      #
      # 定价配错时的表现不是报错：每一次都返回一个语义完全正确的 402，
      # 而用户不会来问「为什么我不能生成」—— 他会走。
      # 实测过一次：占位价下 14 天行程的预留额（10578 CR）就超过注册赠送额
      # （9900 CR），也就是刚注册的用户点 14 天必然被拒。
      #
      # 分母只算真的进了闸门的请求（allowed + insufficient），
      # 不含 free —— 那条路径压根不收费，混进来会把比例稀释掉。
      - alert: TravelCreditInsufficientRatioHigh
        expr: |
          sum(rate(travel_credit_gate_total{outcome="insufficient"}[30m]))
            /
          sum(rate(travel_credit_gate_total{outcome=~"allowed|insufficient"}[30m])) > 0.2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '超过 20% 的计费请求因余额不足被拒'
          description: '按 event 拆开看是生成还是导出。若集中在生成，用 POST /credits/quote 对几个典型天数报一次价，与 CREDIT_SIGNUP_GRANT_CR 比 —— 大概率是价目表或赠送额需要重定，而不是用户真的都花完了。'
          runbook: 'docs/运维手册.md#余额不足占比升高'

      # 10. 过期预留被回收（F1）
      #
      # 回收器本身是兜底：正常路径上预留由 settle / releaseFailed 搬回，
      # 走到过期回收说明**那些任务一个都没经过正常结算** ——
      # Worker 被 OOM / SIGKILL、结算自己抛异常、或者 API 入队失败后
      # 没有任何消费者。回收本身把钱退了，因此用户不会投诉，
      # 而丢掉的任务已经花了模型的钱。
      #
      # 为何不用 absent()：该指标只在 CREDIT_BILLING_ENABLED 开启时存在
      # （回收器受同一个开关门控），而默认部署是关的 —— absent()
      # 会在每个未开计费的环境里持续误报，然后被静音，连带把这条一起静音。
      # 「回收器根本没在跑」的检查放在运维手册里做人工核对。
      - alert: TravelCreditHoldExpiredHigh
        expr: sum(increase(travel_credit_hold_expired_total{outcome="expired"}[1h])) > 5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '一小时内有超过 5 笔 CR 预留靠过期才被回收'
          description: '这些任务没经过正常结算。先看 generation-worker 是不是在被 OOMKill（kubectl get pod 的 restart 次数），再在日志里搜 stage=billing 的「CR 结算失败」。回收已经把钱退给用户了，但那几次生成花掉的模型成本是我们承担的。'
          runbook: 'docs/运维手册.md#过期预留被回收'

      # 11. 回收器自己在报错（F1）
      #
      # 与上一条是两种完全不同的故障：上一条是「回收在工作，上游有问题」，
      # 这一条是「回收本身坏了」—— 而后者的后果是预留**永久冻住**：
      # reserve 把 CR 从 balance_cr 搬到 held_cr，没人搬回来则用户的可用
      # 余额一直少那么多，而 credit_holds_job_uk 让那个任务连重新预留都做不到。
      #
      # 一轮失败不让进程退出（下个周期重试），因此除了这条曲线没有其他症状。
      - alert: TravelCreditHoldSweepFailing
        expr: sum(increase(travel_credit_hold_expired_total{outcome="failed"}[30m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '过期预留回收连续报错'
          description: '回收器挂着时预留不会被释放，用户的可用余额持续减少且不自愈。看 retention-worker 日志里 stage=billing 的「过期预留回收整轮失败」，多数是数据库不可用。手工核对：SELECT count(*) FROM credit_holds WHERE status = ACTIVE AND expires_at < NOW()。'
          runbook: 'docs/运维手册.md#过期预留回收报错'

      # 12. 背压准入开始拒请求
      #
      # 它与 TravelQueueBacklogHigh 是一对，但硬得多：深度高只是「排队变长」，
      # 而这条非 0 意味着**真实用户拿到了 503**。积压可以容忍一阵（告警的
      # for: 5m 就是在容忍突发），丢请求不能。
      #
      # 阈值取 > 0 而不是一个比例：准入阈值（缺省 40）本身已经远高于告警
      # 阈值（8），走到拒绝说明积压已经堆到「新任务在开始之前就会撞上
      # 600 秒」的程度 —— 那不存在「可接受的小比例」。
      - alert: TravelQueueAdmissionRejecting
        expr: sum by (queue) (increase(travel_queue_admission_rejected_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.queue }} 队列已在入口拒绝新请求'
          description: '这是比 TravelQueueBacklogHigh 更硬的扩容信号：用户已经在拿 503。按 queue 标签加对应的 Worker（travel-plan-generation → generation-worker，travel-plan-export → render-worker）。扩容后要同时抬 QUEUE_ADMISSION_MAX_DEPTH 与积压告警阈值，否则新容量下仍会白白拒请求。'
          runbook: 'docs/运维手册.md#背压准入深度过高时直接拒新任务'

      # 13. Chromium 反复重启
      #
      # R-84 的自愈（BrowserHolder 发现断开则串行重启）把一个刺眼的故障
      # 变成了一次重试：以前 Chromium 崩溃以「后续每一个导出都失败」的形式
      # 表现，现在只是三个在途导出失败 + 下一个任务重启后正常。
      #
      # 自愈是对的，而它的副作用是**崩溃变得不可见** —— 这个指标是它唯一的
      # 信号，而在此之前没有人盯它（运维手册那一节开头写的就是「没有告警，
      # 靠看指标」）。不看它就不会知道渲染进程正在反复 OOM。
      #
      # 阈值按运维手册的分档定：一小时 1～2 次是「偶发（某个特大页面），
      # 不用动」，因此 > 3 才是第一个需要人管的档位。定得再低会把自愈本来
      # 已经接住的偶发变成噪声，而噪声告警最终会被静音。
      - alert: TravelRenderBrowserRestartHigh
        expr: sum(increase(travel_render_browser_restart_total[1h])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Chromium 一小时内重启超过 3 次'
          description: '先看 /dev/shm（启动日志的 devShm 与重启 warn 的 dev_shm）：低于 256MB 会自动降级到磁盘并拖慢渲染，调到 512MB 比降并发划得来。重启后立即又崩说明启动就 OOM，要提容器内存上限。注意重启计数不含首次启动与关停，因此部署不会把它抬高。'
          runbook: 'docs/运维手册.md#chromium-反复重启'
