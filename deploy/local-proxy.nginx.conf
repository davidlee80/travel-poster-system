# 本地反代：让浏览器能真的点这个应用（`deploy/local-proxy.yml` 挂载它）
#
# ## 为什么本地非它不可
#
# `NEXT_PUBLIC_API_BASE` 在 web 镜像里固化为**空串**，因此浏览器发的是同源的
# `/api/v1/...`。生产上那些请求由 Nginx 转给 api（云服务器部署说明第 8.1 节），
# 而本地 compose 里没有那一层 —— 直接开 `http://localhost:3000` 时
# `/api/v1/auth/session` 会 404，页面右上角报「网络连接失败」，一步也走不下去。
#
# 在这个文件存在之前，本地的端到端验证全部走 API 层脚本，**没有人从浏览器
# 点过这个应用**。
#
# ## 与生产那份的三处差异
#
#   1. 没有 TLS（本地不签证书）。`.env.deploy` 里 `COOKIE_SECURE=false`，
#      因此明文下 Cookie 照样能设 —— 生产上配了证书就要把它去掉。
#   2. upstream 用**服务名**（`api` / `web`）而不是 `127.0.0.1`：容器之间走
#      compose 网络，写 127.0.0.1 会指向 nginx 容器自己。
#   3. 不代理 MinIO。生产上它在**独立子域**（`travel.doomet.cn`），因为 SigV4
#      把 Host 签进了签名，换域名等于所有预签名 URL 一律 403。本地
#      `S3_PUBLIC_BASE_URL` 指向 `localhost:9000`，而那个端口 compose 已经
#      发布到宿主 —— 浏览器直连即可，不需要经过这里。
#
# 其余（`/render/` 返回 404、`X-Forwarded-For` 覆盖而非追加、65 秒读超时）
# 与生产逐条一致，理由见部署说明。

#   4. 用变量做 upstream + Docker 内置 DNS（下面的 resolver）。生产上后端地址
#      是固定的，本地则每次 `pnpm mvp:build && pnpm mvp:up` 都会重建 api / web
#      容器并换 IP —— 而 nginx 对**字面量** upstream 只在启动时解析一次。
#      症状是重建之后所有 `/api` 请求 502，而 nginx 与 api 都显示 healthy
#      （健康检查探的是 nginx 自己那条链路，它一样会 502 …… 于是连健康检查
#      都不绿，唯一的线索是 502 本身）。实际撞到过一次。

server {
    listen 80;
    server_name localhost;

    # api 的 bodyLimit 是 1MB，留一点余量
    client_max_body_size 2m;

    # Docker 的内置 DNS。127.0.0.11 是固定地址，不随 compose 网络变化。
    # `valid=10s` 让 nginx 每 10 秒重新解析一次服务名。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 17.1 的内部渲染路由不对外。它返回用户私有计划内容，只应由
    # render-worker 从容器网络访问（前端接入契约第 10 节）。
    #
    # 本地也照样 404，是为了让「反代该挡住它」这件事在开发时就成立 ——
    # 只在生产配、本地敞着，最终会有人在本地依赖它然后在生产上撞墙。
    location /render/ {
        return 404;
    }

    location /api/ {
        # 变量形式的 upstream 才会走上面的 resolver（字面量在启动时解析一次
        # 就固化了）。代价是 nginx 不再自动带上原始 URI，必须显式拼
        # `$request_uri` —— 它含查询串，而 `$uri` 不含（计划列表的
        # `?limit=&cursor=` 会被吃掉）。
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆盖而不是追加（不用 $proxy_add_x_forwarded_for）：api 开了
        # trustProxy，会信任这个头的首段。追加模式下客户端能自带一个假 IP
        # 放在最前面，从而绕过 21.4 的 IP 维度防刷
        proxy_set_header X-Forwarded-For $remote_addr;
        # 13.1 提交是异步入队的，但生成状态轮询会长一些
        proxy_read_timeout 65s;
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Next 的 HMR / RSC 流式响应
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
    }
}
