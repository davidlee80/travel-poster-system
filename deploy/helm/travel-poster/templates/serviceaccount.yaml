{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tps.serviceAccountName" . }}
  labels:
    {{- include "tps.labels" . | nindent 4 }}
{{/*
  不挂载 API token：这五个服务都不调用 Kubernetes API。
  默认挂载等于给每个 Pod 一份可以列 Pod、读 Secret（取决于 RBAC）的凭据，
  而一次容器逃逸就能用上它。
*/}}
automountServiceAccountToken: false
{{- end }}
